packages:
  - "apps/*"
  - "packages/*"
  - "backend/workers/*"
  - "backend/services/*"

# --- Install-time supply-chain hardening -------------------------------------
#
# Every setting below needs a pnpm that understands it, or it is decoration.
# `packageManager` in package.json is pinned to 10.34.5 for exactly that reason:
# on 10.11.0 these keys parse fine and do nothing. Verified empirically —
# 10.11.0 resolved a package the age filter should have excluded; a pnpm that
# honours the setting resolved the older version instead.
#
#   minimumReleaseAge   pnpm >= 10.16.0
#   trustPolicy         pnpm >= 10.21.0
#   blockExoticSubdeps  pnpm >= 10.26.0

# Refuse to resolve any version published in the last seven days (in minutes).
#
# Most malicious-publish attacks are detected and unpublished within hours, so a
# quarantine buys real protection for very little. The cost is occasionally not
# being able to take the newest patch on the day an advisory breaks a build —
# which `pnpm install --minimum-release-age 0` can override deliberately, in the
# open, rather than by accident.
#
# This does not affect `--frozen-lockfile` installs: with every version already
# pinned there is no resolution to filter. CI is unaffected.
minimumReleaseAge: 10080

# Never let a dependency update relax a security setting. Without this, a
# package can ship a configuration that quietly downgrades the protections
# above — which would make the rest of this block worth nothing.
trustPolicy: no-downgrade

# Sub-dependencies must come from the registry. A transitive dependency
# resolved from a git URL, a tarball URL or a local path has never passed
# through any of the checks this repository runs, and nothing in a lockfile
# review makes that obvious.
blockExoticSubdeps: true

# One pinned exemption from `trustPolicy`, for a verified false positive.
#
# `semver@6.3.1` and `5.7.2` are the CVE-2022-25883 backports to the old
# majors, published 2023-07-10 from a release path that predates provenance.
# Because they are dated *after* the 7.5.x line that had attestation, and
# trustPolicy compares publish dates across the whole package rather than per
# release line, pnpm reads them as trust going backwards. Both are npm-signed;
# neither is a takeover. Registry evidence is in
# docs/dependency-upgrade-policy.md.
#
# Scope: exactly one name at one version. It does not relax trustPolicy for any
# other package, and a genuine downgrade anywhere else still fails the install.
# Verified by pointing this entry at semver@6.3.0 instead: the install fails
# again on 6.3.1, so the match is per-version and not per-package.
#
# Evidence that it is a false positive rather than a suppressed signal: 6.3.1
# carries a valid npm signature and was published by an npm CLI maintainer
# (lukekarrys), the same release path as the 5.7.2 backport. What it lacks is a
# provenance attestation, which the 7.5.x line has because those were published
# by CI automation. Registry data is in docs/dependency-upgrade-policy.md.
#
# This replaces `pnpm install --trust-policy-exclude "semver@6.3.1"`, which was
# the standing remedy from #120. That kept the exemption visible per-install, at
# the cost of every lockfile regeneration failing for anyone who did not know to
# type it — including CI-adjacent tooling and any future automation. Thirteen
# packages depend on semver 6.3.1, most of them the Babel toolchain, so the flag
# was needed on every dependency change rather than occasionally.
#
# Review by 2026-11-11, matching the ignoreUntil horizon used in
# osv-scanner.toml. That date is advisory and nothing enforces it: unlike an
# osv-scanner ignore, which osv-scanner reports as unused once the advisory
# leaves the tree, and unlike patchedDependencies, which fails the install with
# ERR_PNPM_UNUSED_PATCH, pnpm says nothing about a trustPolicyExclude entry that
# no longer matches anything. Verified -- an entry for a package absent from the
# tree installs silently. So this one needs a human to come back to it.
#
# Retire it when npm backfills provenance onto semver@6.3.1, or when the Babel
# chain stops depending on semver 6. The test is concrete: delete these two
# lines, force a resolve (any manifest change will do), and see whether it still
# fails.
trustPolicyExclude:
  - semver@6.3.1
