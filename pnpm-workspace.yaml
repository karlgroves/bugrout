packages:
  - "apps/*"
  - "packages/*"
  - "backend/workers/*"
  - "backend/services/*"

# --- Install-time supply-chain hardening -------------------------------------
#
# Every setting below needs a pnpm that understands it, or it is decoration.
# `packageManager` in package.json is pinned to 10.34.5 for exactly that reason:
# on 10.11.0 these keys parse fine and do nothing. Verified empirically —
# 10.11.0 resolved a package the age filter should have excluded; a pnpm that
# honours the setting resolved the older version instead.
#
#   minimumReleaseAge   pnpm >= 10.16.0
#   trustPolicy         pnpm >= 10.21.0
#   blockExoticSubdeps  pnpm >= 10.26.0

# Refuse to resolve any version published in the last seven days (in minutes).
#
# Most malicious-publish attacks are detected and unpublished within hours, so a
# quarantine buys real protection for very little. The cost is occasionally not
# being able to take the newest patch on the day an advisory breaks a build —
# which `pnpm install --minimum-release-age 0` can override deliberately, in the
# open, rather than by accident.
#
# This does not affect `--frozen-lockfile` installs: with every version already
# pinned there is no resolution to filter. CI is unaffected.
minimumReleaseAge: 10080

# Never let a dependency update relax a security setting. Without this, a
# package can ship a configuration that quietly downgrades the protections
# above — which would make the rest of this block worth nothing.
trustPolicy: no-downgrade

# Sub-dependencies must come from the registry. A transitive dependency
# resolved from a git URL, a tarball URL or a local path has never passed
# through any of the checks this repository runs, and nothing in a lockfile
# review makes that obvious.
blockExoticSubdeps: true

# Pinned exemptions from `trustPolicy`, every one a verified false positive.
#
# All eleven are the same defect in the check, not eleven separate judgement
# calls. `trustPolicy: no-downgrade` compares publish *dates* across the whole
# package and treats a missing provenance attestation as trust going backwards.
# npm provenance, though, attaches to the *release path*, not to the version: a
# project whose nightlies and canaries publish from CI and whose stable releases
# are cut by a human on a laptop will, every single time, publish an attested
# prerelease and then an unattested release after it. That is the entire
# React Native ecosystem, and it is what this app is built on.
#
# Every entry below was checked against the registry rather than assumed. In all
# eleven cases the flagged version is npm-signed and was published by a
# maintainer who also published attested versions of the same package. None is a
# takeover. The full evidence table is in docs/dependency-upgrade-policy.md.
#
# Scope is an exact name at an exact version — never a package-wide relaxation.
# A genuine downgrade in any other package, or in a different version of these,
# still fails the install. Verified by pointing the semver entry at semver@6.3.0
# instead: the install fails again on 6.3.1, so the match is per-version.
#
# How the list was produced, and how to reproduce it: pnpm reports one violation
# per install, so discovering eleven took eleven installs. Reading the lockfile
# against the registry gets the whole set in one pass — for every name@version
# in pnpm-lock.yaml, fetch https://registry.npmjs.org/<name> and flag any
# version with weaker trust evidence (attestation > npm signature > none) than
# some earlier-published version of the same package. That scan is what said
# eleven of 1081 rather than "eleven so far".
#
# THIS LIST GOES STALE ON EVERY UPGRADE, silently. The versions are pinned, so
# bumping the Expo SDK invalidates the five expo entries and adds five new ones,
# and nothing tells you: unlike an osv-scanner ignore (reported as unused once
# the advisory leaves the tree) or patchedDependencies (ERR_PNPM_UNUSED_PATCH),
# pnpm says nothing about a trustPolicyExclude entry matching nothing. Verified
# — an entry for a package absent from the tree installs silently. Re-run the
# scan above after any upgrade that moves these packages, and delete the entries
# that no longer match. Review by 2026-11-11 regardless, matching the ignoreUntil
# horizon in osv-scanner.toml.
#
# --- Expo SDK 54, five packages ----------------------------------------------
#
# expo@54.0.37, expo-constants@18.0.14, expo-file-system@19.0.24,
# expo-modules-autolinking@3.0.27, jest-expo@54.0.18 — all published
# 2026-08-17 by `alanhughes`, all npm-signed, none attested. What trips the
# check is the SDK 58 canary line: 58.0.0-canary-20260806 and -20260812 publish
# from GitHub Actions with provenance five days earlier, so a stable SDK 54
# patch released after them reads as a downgrade. Across expo's 972 published
# versions only 4 carry an attestation and every one of them is a canary.
#
# These versions are not ours to choose. `pnpm run doctor` (expo-doctor) fails
# on any deviation from the SDK 54 set — which is the check that exists because
# an SDK 56 module in an SDK 54 app type-checks perfectly (issue #30, ADR 0007).
#
# --- Software Mansion native modules, three packages -------------------------
#
# react-native-reanimated@4.1.7, react-native-screens@4.16.0,
# react-native-worklets@0.5.1 — same shape, from nightlies rather than canaries.
# Each publishes a dated nightly from CI (`swm-bot` / GitHub Actions) with
# provenance, sometimes several a week, and cuts stable releases by hand:
# reanimated 4.1.7 by `bartlomiejbloniarz`, screens 4.16.0 by `kligarski`,
# worklets 0.5.1 by `tjzel`. In each case an attested nightly lands one to three
# days before the stable release that the check then rejects.
#
# Also not ours to choose: reanimated and screens are pinned by the SDK 54 set,
# and worklets 0.5.1 is what reanimated 4.1.7 requires.
#
# --- Old-major backports, three packages -------------------------------------
#
# semver@6.3.1 — the CVE-2022-25883 backport to the 6.x line, published
# 2023-07-10 by `lukekarrys`, an npm CLI maintainer, alongside the 5.7.2
# backport. The 7.5.x line that precedes it was published by `npm-cli-ops` from
# CI and carries provenance. Thirteen packages depend on it, most of them the
# Babel toolchain this app builds with.
#
# This entry replaces `pnpm install --trust-policy-exclude "semver@6.3.1"`, the
# standing remedy from #120. That kept the exemption visible per-install, at the
# cost of every lockfile regeneration failing for anyone who did not know to
# type it. #126 and its three predecessors needed the flag on eight separate
# installs in one afternoon. The same reasoning is why the other ten are here
# rather than on a command line eleven flags long.
#
# ua-parser-js@1.0.41 — the 1.x maintenance line, published 2025-08-19 by
# `faisalman`, the sole publisher of all 94 versions. The 2.x line he publishes
# from CI carries provenance; 1.0.41 and 0.7.41, released the same day, do not.
#
# undici-types@6.21.0 — published 2024-11-13 by `matteo.collina`. undici's 6.x
# line carried provenance from 6.13.0 to 6.19.2 and then stopped; it returns on
# 7.1.0. Reached through @types/node.
trustPolicyExclude:
  - semver@6.3.1
  - expo@54.0.37
  - expo-constants@18.0.14
  - expo-file-system@19.0.24
  - expo-modules-autolinking@3.0.27
  - jest-expo@54.0.18
  - react-native-reanimated@4.1.7
  - react-native-screens@4.16.0
  - react-native-worklets@0.5.1
  - ua-parser-js@1.0.41
  - undici-types@6.21.0
