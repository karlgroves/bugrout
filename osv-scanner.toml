# OSV-Scanner ignores.
#
# Every entry needs a reason, an exposure argument, and an `ignoreUntil` date.
# An ignore with no expiry is a permanent suppression, which is how a finding
# stops being looked at. Re-review on expiry or whenever the dependency chain
# changes — whichever comes first.
#
# Only ignore an advisory whose fix this repository cannot actually reach. That
# is two cases, and the reason has to say which one applies:
#
#   1. **No fixed version is published.** Nothing to pin. `braces` and
#      `node-forge` are in this category (their block is at the end).
#      `image-size` was until 2.0.3 shipped, and is closed by an override plus
#      a Metro patch (docs/dependency-upgrade-policy.md).
#   2. **A fixed version exists but is structurally unreachable** — pinning it
#      would break the consumer that pulls the package in, no upstream bump
#      gets there, *and* no patch can bridge the gap. This case needs evidence
#      that the pin breaks, not an assertion that it would — and then evidence
#      that a `pnpm.patchedDependencies` shim cannot fix what it breaks.
#
#      `stream-json` is the one entry that qualifies, and its block below shows
#      what clearing all three grounds looks like. `decode-uri-component` was
#      recorded here in #120 on the first two grounds and #124 removed it: the
#      pin does break query-string@7.1.3's CJS `require`, and no upstream bump
#      reaches 0.5.0, but a two-line patch unwraps the interop. Check the third
#      ground before using this category — the bar is higher than it looks, and
#      that entry is the reason it exists.
#
# If a fix exists and *is* reachable, pin it with a bounded `pnpm.overrides`
# entry in package.json instead; see docs/dependency-upgrade-policy.md. Every
# override is upper-bounded to the current major — an unbounded replacement
# range silently crosses majors (ADR 0007).
#
# Remove an entry the moment it goes green: `osv-scanner` prints an "unused
# ignores" warning when the advisory is no longer in the tree, and that warning
# is the signal to delete the block, not to leave it as insurance.

# stream-json: a fixed version exists (3.5.0) but is structurally unreachable —
# category 2 above. This is the first entry to use that category, so the
# evidence the header asks for is recorded here rather than asserted.
#
# The pin breaks, measured not predicted. Adding
# `"stream-json@<3.5.0": ">=3.5.0 <4"` to pnpm.overrides resolves 3.6.0 and
# takes Detox out entirely — `detox --version` alone dies:
#
#   Error: Cannot find module 'stream-json/jsonl/Parser'
#   code: 'MODULE_NOT_FOUND'
#
# Three independent breaks, any one of them sufficient. 3.x renamed the entry
# points (`jsonl/Parser` -> `jsonl/parser`, `streamers/StreamArray.js` ->
# `streamers/stream-array.js`); it is ESM-only (`"type": "module"`) while Detox
# is CommonJS and reaches it through `require()`; and it replaced the 1.x class
# API with a function factory re-exported from stream-chain 4.x, so
# `JsonlParser.make({ checkErrors: true })` — the exact call in Detox's
# DetoxJSONLParser.js — no longer exists.
#
# No upstream bump reaches the fix. detox@latest IS 20.51.4 and declares
# `stream-json: ^1.7.4`; bunyamin@1.6.3 declares `^1.7.5`. Everything newer than
# 20.51.4 is a 21.x/22.x pre-release, and moving a devDependency onto an RC of a
# major to chase a Medium advisory is a worse trade than the one it fixes.
#
# A patch cannot bridge it either. `pnpm.patchedDependencies` would have to
# re-add the removed capitalised paths, bridge CommonJS to an ESM-only package,
# and reimplement the 1.x Transform-class contract on top of a rewritten
# functional API that delegates to a different major of stream-chain. That is a
# maintained compatibility layer for a library rewrite, not a shim.
#
# Exposure: not reachable, and not shipped. The advisory is in the `pick` /
# `ignore` / `filter` / `replace` path filters. Detox imports only
# `stream-json/jsonl/Parser` and bunyamin only
# `stream-json/streamers/StreamArray.js` — neither pulls in a filter. It is a
# devDependency, so it is absent from the app bundle, and the only JSON it sees
# is the JSONL trace and log files Detox itself just wrote locally. The CVSS
# vector agrees on the shape: AV:L, C:N/I:N/A:H — local, availability only, 6.2.
#
# Not recorded in pnpm.auditConfig.ignoreGhsas. That is deliberate rather than
# an oversight: `security:audit` runs
# `pnpm audit --prod --audit-level=high`, and this advisory is neither a prod
# dependency nor high, so the two gates do not disagree here — only OSV-Scanner
# sees it. Adding a no-op ignore there would imply a finding that gate never
# makes.
#
# Re-review trigger: a stable Detox 21 that moves to stream-json 3.x, whichever
# comes first with the expiry below.

[[IgnoredVulns]]
id = "GHSA-528h-pc64-c93x"
ignoreUntil = 2026-12-05
reason = """stream-json path-filter DoS (CVE-2026-71429). Fixed in 3.5.0, but \
3.x renamed the entry points, is ESM-only, and replaced the class API Detox \
calls — pinning it breaks `detox --version` outright, and detox@latest is \
20.51.4 which declares ^1.7.4. Unreachable anyway: the flaw is in the pick / \
ignore / filter / replace filters, and neither Detox nor bunyamin imports \
one. devDependency, local self-produced JSONL input, AV:L availability-only."""

# braces and node-forge: no fixed version is published — category 1 above.
# Both advisories name the latest release as `last_affected` (braces 3.0.3,
# node-forge 1.4.0), so there is nothing to pin. The upstream fixes exist only
# as unmerged pull requests (micromatch/braces#72 and #75, digitalbazaar/forge
# #1152) as of 2026-10-04.
#
# Exposure: neither package reaches the app bundle or a backend service. Both
# are pulled in by the Expo toolchain that `expo` lists as a runtime dependency,
# which is why `pnpm audit --prod` counts them; neither is imported by app code.
#
# braces (stack-exhaustion DoS via deeply nested patterns): reached only through
# micromatch, in Metro's file map and Jest. The patterns it expands are the glob
# and watch patterns in this repository's own config, written by its developers.
# Nothing a user or a server sends ever becomes a brace pattern.
#
# node-forge (PKCS#1 v1.5 signature forgery with low-exponent keys): reached only
# through @expo/cli's code-signing helpers. `Security.js` only parses PEM
# certificates for `expo run:ios`. `@expo/code-signing-certificates` calls
# `verify` in two places, and neither accepts a signature from anyone else:
# `signBufferRSASHA256AndVerify` checks a signature it has just made with the
# local private key, and `validateSelfSignedCertificate` checks a certificate
# that it then requires to match that same private key. A forged signature
# gains an attacker nothing in either. This app configures no expo-updates
# code signing, so neither path runs in this repository's workflows today.
#
# Remove each block when its package ships a fix: pin it with a bounded
# override instead, and drop the matching `pnpm.auditConfig.ignoreGhsas` entry.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-12-05
reason = """braces <=3.0.3 stack-exhaustion DoS (CVE-2026-93687). No fixed \
version published; the upstream fixes are unmerged PRs. Build-time only: \
reached through micromatch in Metro's file map and Jest, expanding glob \
patterns from this repository's own config. Never in the app bundle or a \
backend, and never fed user or network input."""

[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"
ignoreUntil = 2026-12-05
reason = """node-forge <=1.4.0 PKCS#1 v1.5 signature forgery (CVE-2026-85393). \
No fixed version published; the upstream fix (forge#1152) is unmerged. \
Build-time only, through @expo/cli code signing, which verifies only \
signatures it made with the local private key, or a certificate it then \
requires to match that key. The app configures no expo-updates code signing. \
Never in the app bundle or a backend."""
