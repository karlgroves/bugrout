# OSV-Scanner ignores.
#
# Every entry needs a reason, an exposure argument, and an `ignoreUntil` date.
# An ignore with no expiry is a permanent suppression, which is how a finding
# stops being looked at. Re-review on expiry or whenever the dependency chain
# changes — whichever comes first.
#
# Only ignore an advisory whose fix this repository cannot actually reach. That
# is two cases, and the reason has to say which one applies:
#
#   1. **No fixed version is published.** Nothing to pin. (`image-size`, below.)
#   2. **A fixed version exists but is structurally unreachable** — pinning it
#      would break the consumer that pulls the package in, no upstream bump
#      gets there, *and* no patch can bridge the gap. This case needs evidence
#      that the pin breaks, not an assertion that it would — and then evidence
#      that a `pnpm.patchedDependencies` shim cannot fix what it breaks.
#
#      No entry currently qualifies. `decode-uri-component` was recorded here
#      in #120 on the first two grounds, and #124 removed it: the pin does
#      break query-string@7.1.3's CJS `require`, and no upstream bump reaches
#      0.5.0, but a two-line patch unwraps the interop. Check the third ground
#      before using this category — the bar is higher than it looks.
#
# If a fix exists and *is* reachable, pin it with a bounded `pnpm.overrides`
# entry in package.json instead; see docs/dependency-upgrade-policy.md. Every
# override is upper-bounded to the current major — an unbounded replacement
# range silently crosses majors (ADR 0007).
#
# Remove an entry the moment it goes green: `osv-scanner` prints an "unused
# ignores" warning when the advisory is no longer in the tree, and that warning
# is the signal to delete the block, not to leave it as insurance.

# image-size: no fixed version exists. The advisories cover <=2.0.2 and 2.0.2 is
# the newest release (first_patched = NONE), so no override or SDK bump reaches
# a safe version. Every Metro version through the one Expo SDK 54 pins depends
# on image-size ^1.0.2.
#
# Exposure: build-time only. image-size runs inside the Metro bundler to measure
# local asset dimensions; it is not part of the shipped app bundle and never
# processes a user-supplied or network-supplied image. The vulnerability is an
# infinite loop on a malformed ICNS/JXL/HEIF file, so the worst case is a hung
# local build against an image already in the repo.
#
# These two are also accepted for `pnpm audit` via pnpm.auditConfig.ignoreGhsas
# in package.json — the two scanners have separate ignore mechanisms, so an
# advisory has to be recorded in both places or the gates disagree.

[[IgnoredVulns]]
id = "GHSA-w3rx-r6r6-pgpr"
ignoreUntil = 2026-11-11
reason = """image-size ICNS parser infinite loop. No fixed version exists \
(<=2.0.2, and 2.0.2 is the newest release). Build-time only: runs in the Metro \
bundler, not in the shipped app, and only over assets already in the repo."""

[[IgnoredVulns]]
id = "GHSA-5p2g-fcmc-qvqq"
ignoreUntil = 2026-11-11
reason = """image-size JXL and HEIF parser infinite loops. Same package, same \
unpatched range, same build-time-only exposure as GHSA-w3rx-r6r6-pgpr."""
