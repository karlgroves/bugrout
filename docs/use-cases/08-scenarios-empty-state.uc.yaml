id: scenarios-empty-state
title: "The plans tab explains itself when nothing is saved"
type: negative
description:
  "Verify the saved-plans tab shows a named empty state with an operable
  create control, rather than a blank screen. A plan is what makes the
  two-tap evacuation path possible, so the empty state is where a user learns
  that path exists at all."

preconditions:
  - "The disclaimer has been accepted in this session"
  - "No plans are saved"

start_location: "http://localhost:4599/"

expected_result: "The empty state is shown and the create control is reachable by keyboard."

data:
  tab_scenarios: "Plans"

steps:
  - activate: button "I Understand — Continue"
  - activate: button "Skip for now"
  - activate: button "Get Started"
  - activate: button "Skip for now"

  - locate: tab "{{ tab_scenarios }}"
  - focus: tab "{{ tab_scenarios }}"
  - activate: tab "{{ tab_scenarios }}"

  - verify: text "No Plans Saved"

  - locate: button "Create Plan"
  - focus: button "Create Plan"

  - audit: page

  - activate: button "Create Plan"
  - locate: field "Plan name"
  - focus: field "Plan name"
  - locate: button "Save Plan"
