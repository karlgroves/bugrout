id: destination-search
title: "Search for a destination and reach the route preview"
type: positive
description:
  "Verify the destination picker exposes its search field and saved-scenario
  quick-select through the accessibility tree. Choosing a destination is step
  two of the three-tap flow the product promises: it routes and opens the
  preview, with no separate confirm step (#197). The search box is the only
  place in the app where what a user types leaves the device."

preconditions:
  - "The disclaimer has been accepted in this session"
  - "The device is online, so geocoding is available"

start_location: "http://localhost:4599/"

expected_result:
  "The picker opens, the search field accepts input, and the clear control
  appears once there is something to clear."

data:
  search_field: "Search for an address"
  query: "Sacramento"

steps:
  - activate: button "I Understand — Continue"
  - activate: button "Skip for now"
  - activate: button "Get Started"
  - activate: button "Skip for now"
  - activate: button "Bug Out — set evacuation destination"

  # Every screen presented as a Stack route gets a heading from the navigator.
  # The tab screens do not — see the findings in README.md.
  - verify: heading "Set Destination"

  - locate: field "{{ search_field }}"
  - focus: field "{{ search_field }}"
  - enter: field "{{ search_field }}" value "{{ query }}"

  # The clear control is gated on there being a query, so its appearance is the
  # observable proof the field accepted input — no geocoding needed.
  - locate: button "Clear search"
  - focus: button "Clear search"

  - audit: page
