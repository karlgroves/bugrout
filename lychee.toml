# Link checker configuration (lychee)
no_progress = true
max_concurrency = 8
timeout = 20
max_retries = 2

# Accept GitHub's rate-limit and auth-walled responses as "alive"
accept = ["200..=204", "429"]

exclude = [
  # Placeholder/templated URLs in docs
  "<subdomain>",
  "<state>",
  "<code>",
  "workers\\.dev",
  "localhost",
  "127\\.0\\.0\\.1",
  # Example/stub endpoints
  "example\\.com",
  "sentry\\.io/your-project",
  # AFixt/bugrout-server is PRIVATE. The server code moved there on 2026-11-15
  # and the docs here point at it in sixteen places. GitHub answers 404, not
  # 401 or 403, for a private repository to an unauthenticated client, so
  # neither the `accept` list above nor a token-free retry can tell it from a
  # dead link. Checked by hand instead: `gh repo view AFixt/bugrout-server`
  # resolves. Delete this line if the repository is ever made public.
  "github\\.com/AFixt/bugrout-server",
]

# `.claude` holds Claude Code session worktrees: full checkouts of this repo
# living inside it, so their Markdown is a duplicate of files already checked here.
exclude_path = ["node_modules", "apps/mobile/.expo", "reports", ".claude"]
