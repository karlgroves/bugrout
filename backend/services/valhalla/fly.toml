# fly.toml app configuration file generated for bugrout-valhalla on 2026-04-10T23:03:16-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bugrout-valhalla'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

# The routing graph this machine serves (#266): <extract>/<build-date>, the
# R2 prefix server/<extract>/<build-date>/ the valhalla-graph workflow published.
# Changing it and redeploying swaps the extract or rolls back; no rebuild. The
# value below is a placeholder until the first graph is published, and the
# entrypoint refuses to start on it. R2_ENDPOINT, R2_ACCESS_KEY_ID and
# R2_SECRET_ACCESS_KEY are Fly secrets (docs/deployment-credentials.md).
[env]
  GRAPH_VERSION = 'maryland/UNPUBLISHED'
  GRAPH_BUCKET = 'bugrout-tiles'

# Cache for the graph. The first boot of a version downloads it here; every
# start after that reads it from disk. Old versions stay for instant rollback.
[mounts]
  source = 'valhalla_graph'
  destination = '/graph'
  initial_size = '5gb'

# A TLS-only service, not `[http_service]` (#141). Fly's HTTP handler adds
# `Fly-Tracestate:` with an EMPTY value to every request it forwards, and
# valhalla_service (prime_server) answers any header with an empty value with
# `400 Malformed HTTP request` — so under `[http_service]` every /route and
# /status request failed, and the app silently fell back to mock routes.
# With only the `tls` handler, Fly terminates TLS and passes the client's bytes
# through untouched; no headers are injected.
#
# ALPN is pinned to http/1.1: with raw passthrough, a client that negotiated h2
# would send HTTP/2 frames that valhalla_service cannot parse.
#
# There is deliberately no port 80. Forcing HTTPS needs the `http` handler,
# which is the thing being avoided; every client uses the https:// URL.
[[services]]
  protocol = 'tcp'
  internal_port = 8002
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443
    handlers = ['tls']

    [services.ports.tls_options]
      alpn = ['http/1.1']

  # A ceiling on concurrent connections (#289). The endpoint is public and
  # unauthenticated, and valhalla_service runs ONE worker thread on one shared
  # vCPU, so without a ceiling the queue behind it grows without bound and every
  # request in it outlives the app's 10 s timeout. The type is `connections`
  # because the `tls` handler passes bytes through and Fly Proxy never sees an
  # HTTP request to count. hard_limit: a worst-case route (exclude_polygons at
  # the 250 km limit) takes ~1.7 s (build-graph.sh), so about six can queue and
  # still finish inside the app's 10 s; anything past that would time out
  # anyway. Fly holds traffic over hard_limit at the edge instead of piling it
  # onto the machine. This bounds the damage; it is not access control. A
  # client's idle keep-alive connection counts too, so revisit both numbers
  # with load measurements before raising capacity.
  [services.concurrency]
    type = 'connections'
    soft_limit = 3
    hard_limit = 6

  # Checked on the machine's own address, not through the edge proxy.
  [[services.http_checks]]
    interval = '30s'
    timeout = '5s'
    # Long enough for a first boot to download and verify the graph. A cached
    # start is serving within seconds; this only delays reporting a failure.
    grace_period = '5m'
    method = 'get'
    path = '/status'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
