app = "bugrout-route-tracker"
primary_region = "iad"

# The Dockerfile path is passed on the flyctl command line rather than set here,
# because it is resolved relative to the build context — and the context is the
# repository root, not this directory. See .github/workflows/backend-deploy.yml.
[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
