name: DAST (ZAP baseline)

# Dynamic scan of the deployed worker origins.
#
# Triggered by a completed deployment, or manually. NOT scheduled: a timer-run
# scan reports hours after the change that caused it, attributes it to nobody,
# and gets ignored — the reasoning is in CLAUDE.md, and §13.3 asks for a
# post-deploy gate rather than a cron anyway.
#
# This is the only check in the repository that talks to a real deployment.
# Everything upstream of it — the endpoint regression tests, the header check
# against `wrangler dev` — asserts what the code does. This asserts what the
# platform actually serves, which is a different claim: Cloudflare, a proxy or
# a cache can add, strip or rewrite a header the worker set.
on:
  workflow_run:
    workflows: [Backend Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Origin to scan"
        required: false
        # The origin the app actually calls: EXPO_PUBLIC_TILE_SERVER_URL in
        # apps/mobile/eas.json. security/tests/tile-origin.security.test.ts
        # fails if the two drift apart. tiles.bugrout.app never resolved, so
        # every scan against it failed before ZAP started (#158).
        default: https://bugrout-tile-server.karlgroves.workers.dev

permissions:
  contents: read

concurrency:
  group: dast
  cancel-in-progress: false

jobs:
  baseline:
    name: ZAP baseline
    runs-on: ubuntu-latest
    # Only after a deploy that succeeded. Scanning the origins after a failed
    # deploy tells you about whatever is still running, attributed to a commit
    # that never shipped.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Every `${{ ... }}` below goes through `env:` rather than straight into
      # the shell. `inputs.target` is attacker-influenced in the general case,
      # and interpolating it into `run:` would splice it into the script the
      # runner executes. Caught by Semgrep's run-shell-injection rule in the
      # same pull request that added this workflow, which is roughly the point.
      - name: Resolve the target
        id: target
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          echo "url=${REQUESTED_TARGET:-https://bugrout-tile-server.karlgroves.workers.dev}" >> "$GITHUB_OUTPUT"

      # Cheap and decisive: if the origin is not serving the headers the unit
      # tests say it should, that is worth knowing before spending 20 minutes
      # spidering it.
      - name: Header check against the deployed origin
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          node security/scripts/check-headers.js --production "$TARGET_URL/health"

      - name: Run ZAP baseline
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p reports/security
          # The ZAP image runs as its own user (zap, uid 1000); the checkout
          # belongs to the runner's. Without this ZAP scans, then dies writing
          # its report with EACCES — which is what the first real scan did
          # (#161). Only this directory is opened; ZAP writes nothing else.
          chmod 0777 reports/security

          # Exclusions are read from the file rather than inlined, so adding a
          # destructive endpoint later does not need a workflow edit. Each
          # pattern needs its own index: written to the same index, every
          # entry overwrites the last and only the final one applies
          # (measured: two exclusions at index 0 removed one URL, at 0 and 1
          # removed two). zap-baseline.py splits -z on whitespace, so a
          # pattern containing any is rejected rather than silently mangled.
          zap_options=""
          index=0
          while IFS= read -r pattern; do
            case "$pattern" in ''|'#'*) continue ;; esac
            case "$pattern" in *[[:space:]]*)
              echo "::error::ZAP exclusion contains whitespace: '$pattern'"
              exit 1 ;;
            esac
            entry="globalexcludeurl.url_list.url($index)"
            zap_options="$zap_options -config $entry.regex=$pattern"
            zap_options="$zap_options -config $entry.description=zap-exclusions.txt"
            zap_options="$zap_options -config $entry.enabled=true"
            index=$((index + 1))
          done < security/config/zap-exclusions.txt
          echo "Excluding $index URL pattern(s) from the scan."

          zap_status=0
          docker run --rm \
            -v "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "$TARGET_URL" \
              -c security/config/zap-baseline.conf \
              -r reports/security/zap-report.html \
              -J reports/security/zap-report.json \
              -l WARN \
              -z "$zap_options" \
            || zap_status=$?

          # zap-baseline.py exits 0 when clean, 1 on FAIL-level findings, 2 on
          # WARN-level, and 3 on any other failure. Only FAIL blocks; §19 says
          # medium findings warn. Anything else means there is no scan result,
          # and that must not read as a pass.
          case "$zap_status" in
            0|2) ;;
            1)
              echo "::error::ZAP reported high-confidence high-risk findings."
              exit 1 ;;
            *)
              echo "::error::ZAP did not complete (exit $zap_status); there is no scan result."
              exit 1 ;;
          esac

          # Belt and braces: a scan that produced no report did not happen,
          # whatever the exit code said.
          if [ ! -s reports/security/zap-report.json ]; then
            echo "::error::ZAP exited $zap_status but wrote no reports/security/zap-report.json."
            exit 1
          fi

      - name: Generate security summary
        if: always()
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: node security/scripts/generate-security-report.mjs --target "$TARGET_URL"

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dast-reports
          path: reports/security/
          retention-days: 30
          if-no-files-found: warn
