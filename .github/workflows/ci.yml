name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Least privilege: no job here writes to the repository, publishes packages,
# or posts to the API. `contents: read` is all that is needed to check the code
# out. Deliberately no `security-events: write` anywhere in this repository —
# SARIF stays inside the build artifact.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Safety net for anything that bypassed the Husky hooks
      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Unused files, exports, dependencies and unlisted dependencies. ESLint
      # sees one file at a time and cannot tell that an export is imported
      # nowhere or that a package in package.json is never required; knip reads
      # the whole module graph. Config and every exemption: knip.jsonc.
      - name: Unused code and dependencies (knip)
        run: pnpm run knip

      - name: Test
        run: pnpm run test

      # Catches Expo SDK / native-module mismatches, which typecheck and Jest
      # cannot see: they only read JavaScript source. See issue #30 and ADR 0007.
      - name: Expo SDK alignment (expo-doctor)
        run: pnpm run doctor

      # Builds the real Metro bundle for both native platforms. Catches
      # module-graph failures (bad imports, unresolvable packages, ESM/CJS
      # mismatches) that typecheck cannot see because they are resolution
      # errors, not type errors. Does not compile native code — see issue #30.
      - name: Bundle check (Metro, iOS + Android)
        run: pnpm run bundle:check

      - name: Markdown lint
        run: pnpm run markdownlint

      - name: Duplication
        run: pnpm run dupes

      - name: License compliance
        run: pnpm run license:check

      - name: Audit production dependencies
        run: pnpm run security:audit

      # No marketplace Action here, for trufflehog as for gitleaks before it:
      # secure-project-baseline §5.1/§25 forbid a scanner Action — its licensing
      # behaviour differs from the CLI's, which matters more because this repo
      # is public. (§5.1 named gitleaks; it is being updated fleet-wide to name
      # trufflehog. See security/README.md.)
      #
      # Running the binary directly executes byte-for-byte the same command as
      # `pnpm run security:secrets`, so local and CI can never disagree. The
      # release is pinned by version AND verified by SHA-256 before it runs —
      # a pinned URL alone still trusts whatever bytes the CDN returns.
      #
      # 3.97.4 rather than the newest release, deliberately: it is what
      # Homebrew installs as stable, so `bash scripts/bootstrap.sh` and this job
      # put the same version on PATH. A scanner that finds different things in
      # the two places is worse than a slightly older one.
      - name: Install trufflehog (pinned + checksum-verified)
        env:
          TRUFFLEHOG_VERSION: 3.97.4
          TRUFFLEHOG_SHA256: dc24007c2f233bd61c05beabeb44aa27ea9b43288166279209abe0458c5ce76b
        run: |
          set -euo pipefail
          archive="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -sSLf -o "$archive" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${archive}"
          echo "${TRUFFLEHOG_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C /usr/local/bin trufflehog
          rm -f "$archive"
          trufflehog --version

      # The scan walks commit history, so the `fetch-depth: 0` on this job's
      # checkout is load-bearing: with a shallow clone this silently scans
      # almost nothing and still passes.
      - name: Secret scan (trufflehog)
        run: pnpm run security:secrets
