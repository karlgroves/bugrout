name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Safety net for anything that bypassed the Husky hooks
      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Catches Expo SDK / native-module mismatches, which typecheck and Jest
      # cannot see: they only read JavaScript source. See issue #30 and ADR 0007.
      - name: Expo SDK alignment (expo-doctor)
        run: pnpm run doctor

      # Builds the real Metro bundle for both native platforms. Catches
      # module-graph failures (bad imports, unresolvable packages, ESM/CJS
      # mismatches) that typecheck cannot see because they are resolution
      # errors, not type errors. Does not compile native code — see issue #30.
      - name: Bundle check (Metro, iOS + Android)
        run: pnpm run bundle:check

      - name: Markdown lint
        run: pnpm run markdownlint

      - name: Duplication
        run: pnpm run dupes

      - name: License compliance
        run: pnpm run license:check

      - name: Audit production dependencies
        run: pnpm run security:audit

      # The gitleaks-action wrapper is deliberately NOT used (#82):
      # secure-project-baseline §5.1/§25 forbid it — the Action has separate
      # licensing behaviour from the CLI, which matters more here because this
      # repo is public. It also calls the PR commits API and returns 403
      # "Resource not accessible by integration" without extra token scopes,
      # which range-coach hit and documented.
      #
      # Running the binary directly executes byte-for-byte the same command as
      # `pnpm run security:secrets`, so local and CI can never disagree. The
      # release is pinned by version AND verified by SHA-256 before it runs —
      # a pinned URL alone still trusts whatever bytes the CDN returns.
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C /usr/local/bin gitleaks
          rm -f "$archive"
          gitleaks version

      # `detect` scans commit history, so the `fetch-depth: 0` on this job's
      # checkout is load-bearing: with a shallow clone this silently scans
      # almost nothing and still passes.
      - name: Secret scan (gitleaks)
        run: pnpm run security:secrets
