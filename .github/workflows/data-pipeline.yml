name: Data Pipeline

# Manual only. The weekly cron was removed per the no-scheduled-Actions policy
# in CLAUDE.md, which is explicit that this kind of work does not belong here at
# all:
#
#   Genuinely periodic *product* work — batch jobs, data pipelines, report
#   generation — does not belong in GitHub Actions at all. Run it on real
#   infrastructure with its own scheduler, alerting, and retries.
#
# That applies squarely: this is a 3-hour OSM -> Valhalla/PMTiles build that
# publishes to R2. It is a production data job, not a CI check, and Actions
# gives it no alerting, no retry policy and no run history worth the name. It is
# kept here as a `workflow_dispatch` entry point so tiles can still be rebuilt
# on demand while it is rehomed. See issue #75.
on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated region ids (e.g., md,ca) — ids, not Geofabrik slugs (#241)"
        default: "md"
      upload:
        description: "Upload to R2 after building"
        type: boolean
        default: false

# Least privilege: no job here writes to the repository, publishes packages,
# or posts to the API. `contents: read` is all that is needed to check the code
# out. Deliberately no `security-events: write` anywhere in this repository —
# SARIF stays inside the build artifact.
permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Region Matrix
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.parse.outputs.regions }}
    steps:
      - name: Parse region list
        id: parse
        env:
          REGIONS: ${{ github.event.inputs.regions || 'md' }}
        run: |
          echo "regions=$(jq -cn --arg s "$REGIONS" '$s | split(",") | map(gsub("^\\s+|\\s+$"; ""))')" >> "$GITHUB_OUTPUT"

  build-regions:
    name: Build Regional Packages
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        region: ${{ fromJson(needs.prepare.outputs.regions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y ppa:valhalla-core/valhalla
          sudo apt-get update
          sudo apt-get install -y valhalla-bin osmium-tool python3

      - name: Install Planetiler
        run: |
          curl -L -o data-pipeline/osm/planetiler.jar \
            https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      - name: Build regional package
        working-directory: data-pipeline
        run: ./build-region.sh ${{ matrix.region }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.region }}
          path: data-pipeline/output/${{ matrix.region }}/package/
          retention-days: 7

  upload-to-r2:
    name: Upload to Cloudflare R2
    runs-on: ubuntu-latest
    needs: build-regions
    # `|| github.event_name == 'schedule'` was dropped with the cron. With no
    # schedule trigger the comparison can never be true, so leaving it in would
    # be permanently dead code that reads like a live branch.
    #
    # Behaviour change worth knowing: the scheduled run used to publish to R2
    # unattended. Publishing is now opt-in per run via the `upload` input, which
    # is the safer default for a production data push anyway.
    if: ${{ github.event.inputs.upload == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: data-pipeline/output/

      - name: Upload all regions to R2
        working-directory: data-pipeline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for pkg_dir in output/package-*/; do
            REGION_ID=$(basename "$pkg_dir" | sed 's/package-//')
            echo "Uploading $REGION_ID..."

            for file in "$pkg_dir"/*; do
              FILENAME=$(basename "$file")
              wrangler r2 object put "bugrout-tiles/${REGION_ID}/${FILENAME}" \
                --file "$file"
            done
          done

      - name: Build and upload global manifest
        working-directory: data-pipeline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for pkg_dir in output/package-*/; do
            REGION_ID=$(basename "$pkg_dir" | sed 's/package-//')
            mkdir -p "output/$REGION_ID/package"
            cp "$pkg_dir"/* "output/$REGION_ID/package/"
          done
          ./build-manifest.sh --upload
