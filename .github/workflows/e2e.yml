name: E2E (Detox, Android)

# Boot validation. Nothing else in the pipeline launches the app.
#
# Runs on pull requests that touch anything capable of breaking the boot, and
# on every merge into an integration branch. The path filter is the point: this
# job compiles native code and drives an emulator (~20-30 min), so gating every
# PR on it would be paid mostly by PRs that cannot possibly affect the boot,
# and the ones that can would get lost among them.
#
# What the filter covers is exactly the failure class issue #30 is about. The
# Dependabot triage in #15-#26 produced four unmergeable PRs and CI caught
# almost none of them, because an Expo SDK 56 module in an SDK 54 app
# type-checks perfectly. Every one of those PRs touched package.json and the
# lockfile, so every one would land in this filter.
#
# The weekly cron is gone per the no-scheduled-Actions policy in CLAUDE.md.
#
# NOT a required check yet — the smoke suite has been red since July, all eight
# specs failing on the same Espresso idling error. This PR removes the cause
# (an infinite FAB pulse; see hooks/useReducedMotion.ts), but that fix has not
# been confirmed against a real emulator, so the promotion criterion is
# unchanged: once it is green across several runs, add it to the required
# checks in scripts/apply-branch-protection.sh and note it on issue #30.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    paths:
      # Dependency changes — the case that produced four green-but-broken PRs.
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/mobile/package.json"
      # Anything that changes what gets built or how it starts.
      - "apps/mobile/app.config.ts"
      - "apps/mobile/metro.config.js"
      - "apps/mobile/.detoxrc.js"
      - "apps/mobile/eas.json"
      - "apps/mobile/native-modules/**"
      - "apps/mobile/platform/**"
      - "apps/mobile/app/_layout.tsx"
      - "apps/mobile/services/AppBootstrap.ts"
      # The suite itself.
      - "apps/mobile/e2e/**"
      - ".github/workflows/e2e.yml"

# Least privilege: no job here writes to the repository, publishes packages,
# or posts to the API. `contents: read` is all that is needed to check the code
# out. Deliberately no `security-events: write` anywhere in this repository —
# SARIF stays inside the build artifact.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Detox smoke (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      # The app uses the managed workflow, so android/ does not exist in git.
      # Detox needs a real Gradle project, so generate it first.
      - name: Prebuild native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Release, not debug: a debug build embeds expo-dev-client and boots into
      # the dev-launcher waiting for Metro, so the JS bundle never loads on CI.
      # Release embeds the bundle. Signed with the debug keystore by prebuild.
      - name: Build release APK + androidTest APK
        working-directory: apps/mobile
        run: pnpm run e2e:build

      - name: Run Detox smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: Pixel_6_API_33
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: apps/mobile
          script: pnpm run e2e:smoke

      - name: Upload Detox artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detox-artifacts
          path: apps/mobile/artifacts/
          retention-days: 7
          if-no-files-found: ignore
