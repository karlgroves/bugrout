name: Security

# Previously `schedule` + `workflow_dispatch` only, which meant none of these
# jobs ever ran against a pull request — a vulnerable dependency or a new SAST
# finding could merge and would surface days later on a Monday cron, attributed
# to nobody. Per the no-scheduled-Actions policy in CLAUDE.md, they now gate the
# PR that introduces them.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# NOTE: the CodeQL job was removed when this workflow moved to PR-time.
# CodeQL reports through GitHub code scanning, which requires Advanced Security
# — deliberately not used on this repository. The job could only ever fail with
# "Code scanning is not enabled". Semgrep below is its designated replacement
# and runs the same class of rules. Do not re-add CodeQL, `upload-sarif`, or
# `security-events: write` without that decision changing first.

jobs:
  semgrep:
    name: Semgrep (OWASP Top 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Pinned so the rule engine cannot change between runs. pipx has no
      # hash-checking mode, so this is a version pin, not a checksum; bump it
      # deliberately (docs/dependency-upgrade-policy.md, "Pinned scanner
      # binaries").
      - name: Install Semgrep
        run: pipx install semgrep==1.182.1

      # Rule selection lives in security/config/semgrep.yml and is applied by
      # security/scripts/semgrep.mjs, which `pnpm run security:semgrep` also
      # calls. The argument list used to be spelled out here and in
      # package.json, kept in sync by hand; there is nowhere for them to drift
      # apart now. `node security/scripts/semgrep.mjs --print` shows the exact
      # command.
      #
      # SARIF is written into the artifact below rather than uploaded to code
      # scanning, which needs Advanced Security.
      #
      # Rule selection lives in security/config/semgrep.yml and is applied by
      # security/scripts/semgrep.mjs, which `pnpm run security:semgrep` also
      # calls — so a local run and this job cannot disagree. There are no
      # exclusions left; every one has been retired by the work it deferred
      # (#79 pinned the actions, #80 configured the install-time settings).
      #
      # SARIF is written into the artifact below rather than uploaded to code
      # scanning, which needs Advanced Security.
      - name: Scan
        run: node security/scripts/semgrep.mjs --sarif

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: reports/security/semgrep.sarif
          retention-days: 30
          if-no-files-found: warn

  osv:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned by version AND verified by SHA-256 before it runs, matching the
      # trufflehog step in ci.yml. This binary is the dependency gate, and
      # backend-deploy.yml deploys only after this workflow succeeds, so a
      # substituted scanner that always exits 0 would retire the gate and
      # unblock deploys. `releases/latest` also changed the scanner between
      # runs. 2.7.0 is what Homebrew installs, so local and CI agree.
      - name: Install OSV-Scanner (pinned + checksum-verified)
        env:
          OSV_SCANNER_VERSION: "2.7.0"
          OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
        run: |
          set -euo pipefail
          curl -sSLf -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict -
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          rm -f osv-scanner
          osv-scanner --version

      - name: Scan lockfile
        run: |
          mkdir -p reports/security
          osv-scanner scan --lockfile pnpm-lock.yaml \
            --format json --output reports/security/osv-results.json

      - name: Upload OSV results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-results
          path: reports/security/osv-results.json
          retention-days: 30
          if-no-files-found: warn

  containers:
    name: Containers and IaC (Trivy, Hadolint, Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Version and SHA-256 move together; see "Pinned scanner binaries" in
      # docs/dependency-upgrade-policy.md.
      - name: Install Trivy (pinned + checksum-verified)
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSLf -o "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" trivy
          sudo mv trivy /usr/local/bin/trivy
          rm -f "$archive"
          trivy --version

      - name: Install Hadolint (pinned + checksum-verified)
        env:
          HADOLINT_VERSION: "2.15.1"
          HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
        run: |
          set -euo pipefail
          curl -sSLf -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum --check --strict -
          sudo install -m 0755 hadolint /usr/local/bin/hadolint
          rm -f hadolint
          hadolint --version

      # Version-pinned for the same reason as Semgrep above.
      - name: Install Checkov
        run: pipx install checkov==3.3.30

      # Each step runs the same script the pre-push hook and a developer's
      # shell run, so a local pass and a CI pass cannot disagree.
      - name: Dockerfile lint (Hadolint)
        run: pnpm run security:docker

      - name: IaC scan (Checkov + Trivy config)
        run: pnpm run security:iac

      - name: Filesystem scan (Trivy)
        run: pnpm run security:fs

      # Non-gating, full-severity JSON for the artifact: the gates above ignore
      # unfixed findings because there is nothing to do about them, but that is
      # a reason not to block a merge, not a reason not to record them.
      - name: Write JSON reports
        if: always()
        run: |
          mkdir -p reports/security
          pnpm run security:fs:report || true
          pnpm run security:iac:report || true

      - name: Upload scanner reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-iac-reports
          path: reports/security/

  regression:
    name: Security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Endpoint behaviour: auth, input allowlists, size caps, headers on every
      # response path, and §18's error-leakage regex. Each control these pin was
      # verified to fail the suite when removed — see
      # security/docs/security-test-matrix.md.
      - name: Endpoint regression tests
        run: pnpm run security:tests

      # The tests above assert what the handler constructs. This asserts what a
      # client receives from a running worker, which is a different question.
      - name: Start tile-server locally
        working-directory: backend/workers/tile-server
        run: |
          npx wrangler dev --port 8787 --local &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/health >/dev/null && break
            sleep 2
          done

      - name: Header check against the running worker
        run: node security/scripts/check-headers.js http://127.0.0.1:8787/health

      - name: Generate security summary
        if: always()
        run: |
          mkdir -p reports/security
          pnpm run security:report || true

      - name: Upload security summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-summary
          path: reports/security/
          retention-days: 30
          if-no-files-found: warn

  # OWASP Dependency-Check is deliberately absent.
  #
  # It was moved onto the PR path here and failed on its first real run:
  #
  #     An invalid 'format' of 'HTML,JSON' was specified.
  #
  # The CLI takes repeated -f flags, not a comma-separated list, and the action
  # forwards its `format` input verbatim. That alone is fixable, but three
  # further defects are not:
  #
  #   1. The action passes `args` as a single argv element rather than
  #      tokenising it, so `--suppression .dependency-check-suppressions.xml`
  #      arrived as one option name and could never have applied. The
  #      suppression file was silently inert.
  #   2. No `--failOnCVSS` was set, and the CLI default is 11 on a 0-10 scale,
  #      so the job could not fail on a vulnerability under any circumstances.
  #      It was a report generator wearing a gate's name.
  #   3. At `@main` the action hardcodes `--noupdate` over a
  #      `FROM owasp/dependency-check-action:latest` base image — an unpinned
  #      scanner reading a never-updated NVD database. Its only pinnable release
  #      (1.1.0, 2021) exposes no `args` input at all.
  #
  # Nothing is lost by removing it. OSV-Scanner above queries the same CVE data
  # against the lockfile, actually fails the build, and is green; `pnpm audit
  # --prod --audit-level=high` gates the production tree; Semgrep covers SAST.
  # Dependency-Check's own `--nodeAuditAnalyzer` mode was a wrapper around npm
  # audit regardless.
  #
  # The `dependency-manifests-changed` job that gated it is removed with it — it
  # existed only to keep this job's cost down. Same conclusion, same evidence, as
  # karlgroves/openai-content-moderator#55. Do not re-add either without a
  # scanner that can actually fail.
