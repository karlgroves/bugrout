name: Security

# Previously `schedule` + `workflow_dispatch` only, which meant none of these
# jobs ever ran against a pull request — a vulnerable dependency or a new SAST
# finding could merge and would surface days later on a Monday cron, attributed
# to nobody. Per the no-scheduled-Actions policy in CLAUDE.md, they now gate the
# PR that introduces them.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# NOTE: the CodeQL job was removed when this workflow moved to PR-time.
# CodeQL reports through GitHub code scanning, which requires Advanced Security
# — deliberately not used on this repository. The job could only ever fail with
# "Code scanning is not enabled". Semgrep below is its designated replacement
# and runs the same class of rules. Do not re-add CodeQL, `upload-sarif`, or
# `security-events: write` without that decision changing first.

jobs:
  semgrep:
    name: Semgrep (OWASP Top 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: pipx install semgrep

      # Must stay in sync with the `security:semgrep` script in package.json.
      # SARIF is written to the artifact below rather than uploaded to code
      # scanning, which needs Advanced Security.
      #
      # Rule selection is identical to the `security:semgrep` script in
      # package.json; the two must stay in sync.
      #
      # There are no --exclude-rule flags left. Every exclusion this job started
      # with has been retired by the work it was deferring:
      #
      #   github-actions-mutable-action-tag .. #79, every `uses:` is now pinned
      #       to a commit SHA.
      #   pnpm/npm-missing-minimum-release-age, pnpm-trust-policy,
      #   pnpm-block-exotic-sub-dependencies .. #80, configured in
      #       pnpm-workspace.yaml and .npmrc.
      #
      # SARIF is written into the artifact below rather than uploaded to code
      # scanning, which needs Advanced Security.
      - name: Scan
        run: |
          mkdir -p reports/security
          semgrep scan \
            --config .semgrep/rules \
            --config p/typescript \
            --config p/react \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif --output reports/security/semgrep.sarif \
            --error --metrics=off

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: reports/security/semgrep.sarif
          retention-days: 30
          if-no-files-found: warn

  osv:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OSV-Scanner
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: Scan lockfile
        run: |
          mkdir -p reports/security
          osv-scanner scan --lockfile pnpm-lock.yaml \
            --format json --output reports/security/osv-results.json

      - name: Upload OSV results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-results
          path: reports/security/osv-results.json
          retention-days: 30
          if-no-files-found: warn

  containers:
    name: Containers and IaC (Trivy, Hadolint, Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.74.0"
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSLf -o "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          tar -xzf "$archive" trivy
          sudo mv trivy /usr/local/bin/trivy
          rm -f "$archive"
          trivy --version

      - name: Install Hadolint
        env:
          HADOLINT_VERSION: "2.15.1"
        run: |
          set -euo pipefail
          sudo curl -sSLf -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint
          hadolint --version

      - name: Install Checkov
        run: pipx install checkov

      # Each step runs the same script the pre-push hook and a developer's
      # shell run, so a local pass and a CI pass cannot disagree.
      - name: Dockerfile lint (Hadolint)
        run: pnpm run security:docker

      - name: IaC scan (Checkov + Trivy config)
        run: pnpm run security:iac

      - name: Filesystem scan (Trivy)
        run: pnpm run security:fs

      # Non-gating, full-severity JSON for the artifact: the gates above ignore
      # unfixed findings because there is nothing to do about them, but that is
      # a reason not to block a merge, not a reason not to record them.
      - name: Write JSON reports
        if: always()
        run: |
          mkdir -p reports/security
          pnpm run security:fs:report || true
          pnpm run security:iac:report || true

      - name: Upload scanner reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-iac-reports
          path: reports/security/
          retention-days: 30
          if-no-files-found: warn

  # OWASP Dependency-Check is deliberately absent.
  #
  # It was moved onto the PR path here and failed on its first real run:
  #
  #     An invalid 'format' of 'HTML,JSON' was specified.
  #
  # The CLI takes repeated -f flags, not a comma-separated list, and the action
  # forwards its `format` input verbatim. That alone is fixable, but three
  # further defects are not:
  #
  #   1. The action passes `args` as a single argv element rather than
  #      tokenising it, so `--suppression .dependency-check-suppressions.xml`
  #      arrived as one option name and could never have applied. The
  #      suppression file was silently inert.
  #   2. No `--failOnCVSS` was set, and the CLI default is 11 on a 0-10 scale,
  #      so the job could not fail on a vulnerability under any circumstances.
  #      It was a report generator wearing a gate's name.
  #   3. At `@main` the action hardcodes `--noupdate` over a
  #      `FROM owasp/dependency-check-action:latest` base image — an unpinned
  #      scanner reading a never-updated NVD database. Its only pinnable release
  #      (1.1.0, 2021) exposes no `args` input at all.
  #
  # Nothing is lost by removing it. OSV-Scanner above queries the same CVE data
  # against the lockfile, actually fails the build, and is green; `pnpm audit
  # --prod --audit-level=high` gates the production tree; Semgrep covers SAST.
  # Dependency-Check's own `--nodeAuditAnalyzer` mode was a wrapper around npm
  # audit regardless.
  #
  # The `dependency-manifests-changed` job that gated it is removed with it — it
  # existed only to keep this job's cost down. Same conclusion, same evidence, as
  # karlgroves/openai-content-moderator#55. Do not re-add either without a
  # scanner that can actually fail.
