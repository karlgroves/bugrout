version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The Expo/React Native stack is version-locked to the Expo SDK. Every
    # unimodule's native side is compiled against one SDK's runtime, and the
    # pinned set lives in expo/bundledNativeModules.json. Upgrading any of them
    # on its own is an ABI mismatch that CI cannot detect: peerDependencies are
    # declared as "*", and format/lint/typecheck/Jest never touch native code,
    # so such a PR goes green and fails on device instead. React Native is also
    # 0.x, so a five-release jump (0.81 -> 0.86) registers as a "minor" bump and
    # lands in the grouped PR below. Both traps produced merge-ready-looking PRs
    # (#19, #20, #22, #25) that would have broken the app.
    #
    # These upgrades are done deliberately with `npx expo install --fix`, which
    # moves the whole set together, in a dedicated SDK-upgrade PR validated
    # against a real device build.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: "jest-expo"
      - dependency-name: "@maplibre/maplibre-react-native"
      # Jest's major is dictated by jest-expo, which is SDK-locked above.
      # jest-expo depends on the Jest 29 packages directly (@jest/globals,
      # jest-snapshot, babel-jest, jest-environment-jsdom, all ^29.2.1), so a
      # Jest 30 runner calls into APIs the installed jest-mock does not have
      # and every suite dies at load with
      # "this._moduleMocker.clearMocksOnScope is not a function". PR #34 hit
      # exactly this: 14 suites, 102 tests, 0 running. jest-expo 55.x still
      # pins ^29.2.1, so this is not unblocked by the SDK 54 -> 55 upgrade —
      # it needs upstream Expo to migrate jest-expo to Jest 30 first.
      #
      # Major only: patch and minor Jest updates still flow through the
      # grouped PR below.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      # TypeScript is pinned by the Expo SDK too: SDK 54 expects `~5.9.2`, so
      # expo-doctor's "packages match versions required by installed Expo SDK"
      # check fails on anything at or above 5.10. PR #32 (6.0.3) was green on
      # lint, typecheck, test and bundle after two tsconfig `types` additions,
      # and still could not pass that gate without adding typescript to
      # `expo.install.exclude` — permanently silencing SDK drift detection for
      # the compiler in exchange for an early major we get no benefit from.
      #
      # Major AND minor: `~5.9.2` allows patch only, so 5.10 would break the
      # doctor gate exactly like 6.0 does. Patch updates still flow through the
      # grouped PR. TypeScript rides along with the SDK upgrade instead, via
      # `npx expo install --fix`.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # @types/node's major tracks the Node major, and we pin Node 22 in three
      # places: .nvmrc, engines (>=22.0.0) and route-tracker's Dockerfile
      # (node:22-slim). Types ahead of the runtime are invisible to CI —
      # @types/node 26 declares node:ffi and node:quic, both of which throw
      # ERR_UNKNOWN_BUILTIN_MODULE on Node 22, so importing one would
      # typecheck, lint and pass CI, then crash in production. PR #60.
      #
      # Major only: 22.x updates still flow through the grouped PR. When the
      # repo moves to a newer Node, @types/node moves in that same PR, where
      # runtime and types change together and can be validated together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
