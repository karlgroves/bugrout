# ZAP API scan rule configuration — §19.
#
# Used for the API scan against an OpenAPI/endpoint definition, as distinct
# from the baseline spider. Kept separate because the two scans surface
# different rule sets and conflating them makes an ignore in one silently
# apply to the other.

10015	IGNORE	Incomplete or No Cache-control — see zap-baseline.conf.
10096	IGNORE	Timestamp Disclosure — crowd-signal's `ts` field is intentional.
90005	IGNORE	Sec-Fetch headers — no browser client.

# Injection and error-handling rules stay at their default (FAIL on high
# confidence). security/tests/input-validation.security.test.ts covers the same
# ground at unit level; this is the check that the deployed thing agrees.
