# ZAP baseline rule configuration — §19.
#
# Format: <ruleId>\t<action>\t<comment>, where action is IGNORE, WARN or FAIL.
# Rules not listed take the scan's default. `-l WARN` on the command line makes
# medium findings warn; high-confidence high-risk findings fail.
#
# These origins serve JSON and binary tiles to a native mobile client. They are
# not documents, are never framed, and set no cookies — so a handful of ZAP's
# browser-oriented rules are noise here rather than findings, and each is
# ignored with the reason written down.

10015	IGNORE	Incomplete or No Cache-control — tile packages are immutable and cached by ETag; the manifest sets its own Cache-Control.
10021	IGNORE	X-Content-Type-Options — asserted directly in security/tests/headers.security.test.ts on every response path.
10027	IGNORE	Information Disclosure - Suspicious Comments — matches on words in JSON payloads, not on served source.
10096	IGNORE	Timestamp Disclosure — crowd-signal returns a `ts` field by design; it is the telemetry's own timestamp.
10109	IGNORE	Modern Web Application — heuristic aimed at SPAs; there is no HTML here to be one.
90005	IGNORE	Sec-Fetch headers — set by browsers, and the only client is a React Native app.

# Cookie rules: these services set no cookies at all. If one ever does, delete
# the corresponding line rather than leaving it ignored.
10010	FAIL	Cookie No HttpOnly Flag — no endpoint should be setting a cookie.
10011	FAIL	Cookie Without Secure Flag — as above.
10054	FAIL	Cookie Without SameSite Attribute — as above.
